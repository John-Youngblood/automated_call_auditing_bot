# Production: serve the bundle and reverse-proxy the API/websocket so the
# dashboard stays single-origin, exactly as it is in development.
upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed assets are immutable; index.html must never be cached or clients
    # keep booting a stale bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A screening call can be silent for minutes; the default 60s read
        # timeout would sever the socket mid-call.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Streaming, so no response buffering.
        proxy_buffering off;
    }
}
