[project]
name = "call-screener-backend"
version = "0.1.0"
description = "Real-time phone call screening: telephony webhooks, streaming STT, dashboard fan-out"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
